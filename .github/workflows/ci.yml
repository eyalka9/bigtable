name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --info

    - name: Run tests
      run: ./gradlew test --info

    - name: Run binary update tests
      run: |
        ./gradlew test --tests "amat.arrowstore.bigtable.ArrowTableControllerIntegrationTest.testBinaryUpdateDataIntegrity_Arrow" --info
        ./gradlew test --tests "amat.arrowstore.bigtable.ArrowTableControllerIntegrationTest.testBinaryUpdatePerformance_Sequential_Arrow" --info
        ./gradlew test --tests "amat.arrowstore.bigtable.ArrowTableControllerIntegrationTest.testBinaryUpdatePerformance_RandomIndex_Arrow" --info

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: build/reports/tests/

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: build/test-results/**/*.xml
