name: Vector API Performance Comparison

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  vector-api-performance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Pure Java vs Vector API (SIMD) performance comparison test
      run: ./gradlew test --tests "amat.arrowstore.bigtable.ArrowTableVectorAPIPerformanceTest.testJavaVsVectorAPIPerformance" --info

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vector-api-performance-test-reports
        path: build/reports/tests/

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: build/test-results/**/*.xml
